# 镜像发布：push main 构建并推 ghcr.io（tag latest），打 tag 时额外打版本号。
# 镜像可见性跟随仓库（私有）。部署机拉取前先：
#   echo $GH_PAT | docker login ghcr.io -u <用户名> --password-stdin
# GH_PAT 需要 read:packages 权限（公开仓库则无需登录）。
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 小写要求：ghcr 镜像名必须全小写
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # 打 tag（v1.2.3）→ 1.2.3 + latest
            type=ref,event=tag
            # push main → latest（Actions 里 docker/metadata 默认会加 branch tag，
            # 显式只要 latest，避免镜像 tag 噪音）
            type=raw,value=latest
            # 每次构建都留一个 sha 快照，方便回滚到任意版本
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
